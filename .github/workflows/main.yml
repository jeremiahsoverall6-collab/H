
name: Build Among Us Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
      - name: Install Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platforms;android-35" \
            "build-tools;35.0.0"
            

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: |
          mkdir project
          unzip -q AmongUsMobileOverlay_APK_and_Source.zip -d project

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - name: Package APK and source
        run: |
          mkdir -p output
          cp project/app/build/outputs/apk/debug/app-debug.apk output/AmongUsMobileOverlay.apk
          cp AmongUsMobileOverlay_APK_and_Source.zip output/source.zip
          cd output
          zip -r ../AmongUsMobile_APK.zip .

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AmongUsMobile-APK
          path: AmongUsMobile_APK.zip
          
