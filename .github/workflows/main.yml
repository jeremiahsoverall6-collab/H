
      - name: Package APK and source
        run: |
          mkdir -p output
          cp project/app/build/outputs/apk/debug/app-debug.apk output/AmongUsMobileOverlay.apk
          cp project-source.zip output/
          cd output
          zip -r AmongUsMobile_APK.zip AmongUsMobileOverlay.apk project-source.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmongUsMobile-APK
          path: output/AmongUsMobile_APK.zip
          if-no-files-found: error
          
