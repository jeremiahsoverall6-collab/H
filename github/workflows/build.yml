
name: Build Among Us Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract source ZIP
        run: |
          SOURCE_ZIP=$(find . -maxdepth 1 -type f -name '*.zip' ! -name 'AmongUsMobile_APK.zip' | head -n 1)
          if [ -z "$SOURCE_ZIP" ]; then
            echo "Source ZIP not found!"
            exit 1
          fi
          mkdir project
          unzip -q "$SOURCE_ZIP" -d project

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - name: Package APK and source
        run: |
          mkdir -p output
          cp project/app/build/outputs/apk/debug/app-debug.apk output/AmongUsMobileOverlay.apk
          SOURCE_ZIP=$(find . -maxdepth 1 -type f -name '*.zip' ! -name 'AmongUsMobile_APK.zip' | head -n 1)
          cp "$SOURCE_ZIP" output/source.zip
          cd output
          zip -r ../AmongUsMobile_APK.zip .

      - name: Upload APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AmongUsMobile-APK
          path: AmongUsMobile_APK.zip
          if-no-files-found: error
          
